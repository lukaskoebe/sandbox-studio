name: screenshots

# Takes the docs screenshots (site/src/assets/screenshots) from a real Studio with real VMs,
# and opens a pull request with the ones whose pixels changed (site/scripts). It runs after
# each release, against that release's Linux binary, and by hand for any release. Opening the
# pull request needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings, and the pull request's checks start once someone pushes to it. The script
# comes from main, so its steps follow main's UI; right after a release the two agree.

on:
  # release.yml publishes with the workflow's token, whose events start no workflows; the
  # end of its run does. A run for a release branch, a failed one or a pre-release is skipped.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to take the screenshots of; the latest when empty
        type: string
        default: ""

permissions: {}

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Give the runner user access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          tag="${TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          case "$tag" in v[0-9]*) ;; *) echo "not a release tag: $tag"; exit 1 ;; esac
          name="sandbox-studio_${tag}_linux_amd64"
          dir="$RUNNER_TEMP/release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name.tar.gz" --pattern checksums.txt --dir "$dir"
          (cd "$dir" && grep "  $name.tar.gz\$" checksums.txt | sha256sum -c - && tar -xzf "$name.tar.gz")
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "STUDIO=$dir/$name/studio" >> "$GITHUB_ENV"
      - name: Start Studio
        run: |
          # A data directory of its own; login-url finds Studio through it.
          echo "SANDBOX_STUDIO_HOME=$RUNNER_TEMP/studio-home" >> "$GITHUB_ENV"
          export SANDBOX_STUDIO_HOME="$RUNNER_TEMP/studio-home"
          mkdir -p "$SANDBOX_STUDIO_HOME"
          "$STUDIO" -no-browser > "$RUNNER_TEMP/studio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/studio.pid"
          for _ in $(seq 1 600); do
            grep -q 'sandbox studio listening' "$RUNNER_TEMP/studio.log" && exit 0
            kill -0 "$(cat "$RUNNER_TEMP/studio.pid")" 2>/dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/studio.log"
          exit 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Take the screenshots
        id: shots
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright-core install --with-deps chromium
          CHROMIUM="$(node -e 'import("playwright-core").then((m) => console.log(m.chromium.executablePath()))')"
          export CHROMIUM
          STUDIO_DATA_DIR="$SANDBOX_STUDIO_HOME" node scripts/screenshots.mjs "$("$STUDIO" login-url)"
      - name: Keep the screenshots whose pixels changed
        if: always() && steps.shots.outcome != 'skipped'
        working-directory: site
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow==11.3.0
          "$RUNNER_TEMP/venv/bin/python" -I scripts/screenshots-changed.py src/assets/screenshots
      - name: Open a pull request
        if: always() && steps.shots.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.shots.outcome }}
        run: |
          if [ -z "$(git status --porcelain -- site/src/assets/screenshots)" ]; then
            echo "No screenshot changed."
            exit 0
          fi
          branch="screenshots/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- site/src/assets/screenshots
          git commit -m "Docs screenshots of $TAG"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          body="The docs screenshots that changed, taken from the $TAG release by the screenshots workflow."
          if [ "$OUTCOME" != success ]; then
            body="$body Some screenshots failed; the run's log names them, and they are not in this pull request."
          fi
          if ! gh pr view "$branch" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Docs screenshots of $TAG" --body "$body"
          fi
      - name: Logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/studio.log" || true
          cat "$SANDBOX_STUDIO_HOME/logs/studio.log" 2>/dev/null || true
