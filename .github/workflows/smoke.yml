name: smoke

# Sets Studio up as a user does, on each host OS: build it, start it (it installs msb on the
# first start), create a sandbox, wait until its guest agent connects, and delete it. Linux
# boots the base image built from this commit; macOS and Windows, which can't build it, boot
# the latest released one. A runner without a hypervisor skips the boot with a warning.
# Linux then runs the browser tests of web/e2e-live against the same Studio. release.yml
# calls it with the base image it just pushed, which every host then boots, before it
# publishes.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        description: A base image for every host to boot instead of the default
        type: string
        default: ""

permissions:
  contents: read

env:
  GO_TAGS: nobadger,nomysql,nopgx

jobs:
  # The web UI and the Linux guest agents are the same for every host, as in release.yml.
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: make web agent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-assets
          if-no-files-found: error
          path: |
            internal/webui/static/app
            internal/agentbin/dist/studio-agent-linux-*

  vm:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, exe: studio }
          - { runner: macos-15, exe: studio }
          - { runner: windows-2025, exe: studio.exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-assets
          path: internal
      - name: Give the runner user access to /dev/kvm
        if: runner.os == 'Linux'
        run: |
          ls -l /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Build Studio
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -tags "$GO_TAGS" -o "$EXE" ./cmd/studio
      - name: The given base image
        if: inputs.image != ''
        env:
          GIVEN: ${{ inputs.image }}
        run: echo "IMAGE=$GIVEN" >> "$GITHUB_ENV"
      - name: Latest released base image
        if: runner.os != 'Linux' && inputs.image == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "IMAGE=ghcr.io/lukaskoebe/sandbox-studio-base:$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)" >> "$GITHUB_ENV"
      - name: The base image of this commit
        if: runner.os == 'Linux' && inputs.image == ''
        run: echo "IMAGE=sandbox-studio-base:dev" >> "$GITHUB_ENV"
      - name: Start Studio
        if: runner.os != 'Windows'
        run: |
          # A data directory of its own; the commands below find Studio through it.
          echo "SANDBOX_STUDIO_HOME=$RUNNER_TEMP/studio-home" >> "$GITHUB_ENV"
          export SANDBOX_STUDIO_HOME="$RUNNER_TEMP/studio-home"
          mkdir -p "$SANDBOX_STUDIO_HOME"
          ./"$EXE" -image "$IMAGE" > "$RUNNER_TEMP/studio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/studio.pid"
          for _ in $(seq 1 600); do
            grep -q 'sandbox studio listening' "$RUNNER_TEMP/studio.log" && exit 0
            kill -0 "$(cat "$RUNNER_TEMP/studio.pid")" 2>/dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/studio.log"
          exit 1
      - name: Start Studio (Windows)
        # The runner runs steps in a job object that doesn't allow breakaway, and msb starts
        # each VM detached with CREATE_BREAKAWAY_FROM_JOB, which then fails with "Access is
        # denied". WMI starts Studio outside the job, as a user's own start would.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP studio-home
          "SANDBOX_STUDIO_HOME=$data" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $data | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE studio.exe
          $log = Join-Path $env:RUNNER_TEMP studio.log
          $cmd = "cmd.exe /c set SANDBOX_STUDIO_HOME=$data&& `"$exe`" -image $env:IMAGE > `"$log`" 2>&1"
          $r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $cmd; CurrentDirectory = $env:GITHUB_WORKSPACE }
          if ($r.ReturnValue -ne 0) { throw "Win32_Process.Create returned $($r.ReturnValue)" }
          for ($i = 0; $i -lt 600; $i++) {
            if ((Test-Path $log) -and (Select-String -Quiet -Path $log -Pattern 'sandbox studio listening')) { exit 0 }
            Start-Sleep 1
          }
          Get-Content $log
          exit 1
      - name: Build the base image
        if: runner.os == 'Linux' && inputs.image == ''
        run: PATH="$HOME/.microsandbox/bin:$PATH" make image
      - name: Host checks
        id: doctor
        run: |
          ./"$EXE" -image "$IMAGE" doctor || true
          if [ "$RUNNER_OS" = macOS ] && [ "$(sysctl -n kern.hv_support 2>/dev/null)" != 1 ]; then
            echo "::warning::This runner has no Hypervisor.framework (no nested virtualization); the sandbox boot is skipped."
            echo "boot=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create a sandbox and wait until its agent connects
        if: steps.doctor.outputs.boot != 'false'
        timeout-minutes: 25
        run: |
          ./"$EXE" create smoke --cpus 2 --memory 2
          ./"$EXE" show smoke
      - name: Delete the sandbox
        if: steps.doctor.outputs.boot != 'false'
        run: ./"$EXE" rm smoke --yes
      # The web UI against the real VMs (web/e2e-live): create a sandbox, run a container,
      # approve a host and open a preview, in Chromium.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: runner.os == 'Linux'
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - name: Browser tests on a real VM
        id: live
        if: runner.os == 'Linux'
        timeout-minutes: 30
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          STUDIO_LOGIN_URL="$(../"$EXE" login-url)" pnpm exec playwright test -c e2e-live/playwright.config.ts
      - name: Upload the browser test results
        if: failure() && steps.live.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-live
          path: |
            web/test-results/live
            web/playwright-report/live
      - name: msb on its own
        # Tells a Studio problem from a host one when the sandbox didn't boot.
        if: failure() && steps.doctor.outcome == 'success'
        run: |
          export PATH="$HOME/.microsandbox/bin:$PATH"
          msb pull "$IMAGE" || true
          msb run alpine -- echo booted || true
      - name: Logs
        if: always()
        run: |
          ./"$EXE" show smoke --json || true
          cat "$RUNNER_TEMP/studio.log" || true
          for f in "$HOME"/.microsandbox/sandboxes/*/logs/*.log; do
            [ -f "$f" ] && { echo "== $f"; tail -n 80 "$f"; }
          done
          true
