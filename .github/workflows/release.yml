name: release
# A push to a release branch (release/v1.2.3) builds and smoke-tests everything a release
# would ship without publishing it; the version tag (v1.2.3, v1.2.3-rc.1), pushed once that
# run and ci pass on the branch's head, builds again and publishes. See docs/release.md.
# Signing steps run only when their secrets are set; without them the artifacts are unsigned.
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_TAGS: nobadger,nomysql,nopgx
  IMAGE: ghcr.io/lukaskoebe/sandbox-studio-base
  BROWSER: ghcr.io/lukaskoebe/sandbox-studio-browser

jobs:
  # The version the build carries: the tag, or the release branch's name without release/.
  # A branch run's images are pushed as <version>-candidate, so they never take the tag a
  # release's images get.
  meta:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-tag: ${{ steps.version.outputs.image-tag }}
    steps:
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME image_tag=$GITHUB_REF_NAME
          else
            version=${GITHUB_REF_NAME#release/} image_tag=${GITHUB_REF_NAME#release/}-candidate
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME does not name a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image-tag=$image_tag" >> "$GITHUB_OUTPUT"

  # The base and browser images for both guest architectures, pushed and then referenced
  # by digest.
  image:
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
      browser: ${{ env.BROWSER }}@${{ steps.push-browser.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.meta.outputs.image-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - id: push-browser
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BROWSER }}:${{ needs.meta.outputs.image-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.BROWSER }}
          subject-digest: ${{ steps.push-browser.outputs.digest }}
          push-to-registry: true

  # The web UI and the Linux guest agents are the same for every host build.
  assets:
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: web UI and guest agents
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: make web agent VERSION="$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets
          if-no-files-found: error
          path: |
            internal/webui/static/app
            internal/agentbin/dist/studio-agent-linux-*

  # The microsandbox SDK needs CGO, so each target builds on a native runner; nothing is
  # cross-compiled.
  build:
    needs: [meta, image, assets]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: arm64, runner: macos-15 }
          - { goos: windows, goarch: amd64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NAME: sandbox-studio_${{ needs.meta.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
      EXE: studio${{ matrix.goos == 'windows' && '.exe' || '' }}
      BASE_IMAGE: ${{ needs.image.outputs.ref }}
      BROWSER_IMAGE: ${{ needs.image.outputs.browser }}
      # Mapped to env so that steps can be skipped when a secret is missing.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assets
          path: internal
      - name: build
        env:
          CGO_ENABLED: "1"
        run: |
          pkg=github.com/lukaskoebe/sandbox-studio/internal/version
          go build -trimpath -tags "$GO_TAGS" \
            -ldflags "-s -w -X $pkg.Version=$VERSION -X $pkg.BaseImage=$BASE_IMAGE -X $pkg.BrowserImage=$BROWSER_IMAGE" \
            -o "dist/$NAME/$EXE" ./cmd/studio
          if [ "${{ matrix.goos }}" = windows ]; then
            # The tray launcher: no console window, and no cgo.
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o "dist/$NAME/studiow.exe" ./cmd/studiow
          fi
          cp LICENSE README.md "dist/$NAME/"
          "dist/$NAME/$EXE" openapi > /dev/null

      - name: sign (macOS)
        if: matrix.goos == 'darwin' && env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          codesign --force --timestamp --options runtime \
            --entitlements packaging/macos/studio.entitlements \
            --sign "$APPLE_SIGNING_IDENTITY" "dist/$NAME/$EXE"
          codesign --verify --strict --verbose=2 "dist/$NAME/$EXE"
      - name: notarize (macOS)
        if: matrix.goos == 'darwin' && env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # A bare executable can't be stapled; Gatekeeper looks the ticket up online.
          ditto -c -k --keepParent "dist/$NAME/$EXE" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: sign (Windows)
        if: matrix.goos == 'windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          foreach ($exe in @($env:EXE, "studiow.exe")) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\$env:NAME\$exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa "dist\$env:NAME\$exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item $pfx

      - name: package
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = windows ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.NAME }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip

  # Every host that can boots the pushed base image with Studio built from the tag or branch,
  # and runs the live browser tests, before anything is published.
  smoke:
    needs: image
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    with:
      image: ${{ needs.image.outputs.ref }}

  # Only a tag publishes; a release branch's run ends with the smoke tests.
  release:
    if: github.ref_type == 'tag'
    needs: [image, build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sandbox-studio_*
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum -- * > checksums.txt && cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_IMAGE: ${{ needs.image.outputs.ref }}
          BROWSER_IMAGE: ${{ needs.image.outputs.browser }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          notes="Install on Linux or macOS: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | SANDBOX_STUDIO_VERSION=$GITHUB_REF_NAME sh\`

          Base image: \`$BASE_IMAGE\`
          Browser image: \`$BROWSER_IMAGE\`

          Windows support is a preview. Verify downloads with \`sha256sum -c checksums.txt --ignore-missing\` or \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes" "${prerelease[@]}"
