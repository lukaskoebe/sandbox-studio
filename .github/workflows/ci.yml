name: ci
on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/studio
      - name: API schema is up to date (make api)
        if: runner.os == 'Linux'
        run: go run ./cmd/studio openapi | diff -u web/openapi.json -
      - name: guest agent (linux)
        shell: bash
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/studio-agent

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: API client types are up to date (make api)
        run: pnpm exec openapi-typescript openapi.json -o "$RUNNER_TEMP/schema.gen.ts" && diff -u src/lib/api/schema.gen.ts "$RUNNER_TEMP/schema.gen.ts"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
