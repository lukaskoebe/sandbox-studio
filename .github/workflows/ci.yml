name: ci
on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          # errcheck has open findings (see .golangci.yml); CI runs the other linters.
          args: --disable errcheck
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/studio
      - name: API schema is up to date (make api)
        if: runner.os == 'Linux'
        run: go run ./cmd/studio openapi | diff -u web/openapi.json -
      - name: guest agent (linux)
        shell: bash
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/studio-agent
      - name: install.sh
        if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/test-install.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: API client types are up to date (make api)
        run: pnpm exec openapi-typescript openapi.json -o "$RUNNER_TEMP/schema.gen.ts" && diff -u src/lib/api/schema.gen.ts "$RUNNER_TEMP/schema.gen.ts"
      - name: OpenCode plugin compatibility
        run: node --test ../internal/harness/opencode-plugin.test.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Chromium for Playwright
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: go vet -tags e2e,nobadger,nomysql,nopgx ./...
      - name: End-to-end suite against the fake runtime
        run: make e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
