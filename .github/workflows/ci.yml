name: ci
on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/studio
      - name: API schema is up to date (make api)
        if: runner.os == 'Linux'
        run: go run ./cmd/studio openapi | diff -u web/openapi.json -
      - name: guest agent (linux)
        shell: bash
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/studio-agent
      - name: install.sh
        if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/test-install.sh scripts/macos-app.sh

  # The app (cmd/studio-app) is a module of its own, so the go job's ./... leaves it out.
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: cmd/studio-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: vet, test and build
        run: |
          tags=""
          if [ "$RUNNER_OS" = Linux ]; then tags="-tags gtk3"; fi
          if [ "$RUNNER_OS" = Windows ]; then export CGO_ENABLED=0; fi
          go vet $tags .
          go test $tags .
          go build $tags -o studio-app-ci .
      # Building isn't starting: v0.11.0's app built here and exited at once on macOS, where
      # the notifications service wants a bundle. The self-test starts the app with its
      # services, loads Studio (its fallback page) in a hidden window and prints what it saw.
      - name: the app starts, bare and as Sandbox Studio.app (macOS)
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/studio" ./cmd/studio
          scripts/macos-app.sh cmd/studio-app/studio-app-ci "$RUNNER_TEMP" dev
          export SANDBOX_STUDIO_HOME="$RUNNER_TEMP/studio-home"
          selftest() {
            out=$("$1" -selftest -addr 127.0.0.1:7911 -studio "$RUNNER_TEMP/studio")
            echo "$out"
            if echo "$out" | grep -q '"error"'; then cat "$SANDBOX_STUDIO_HOME"/logs/studio.log || true; exit 1; fi
            echo "$out" | grep -q "\"notifications\": $2" || { echo "notifications: want $2"; exit 1; }
          }
          selftest cmd/studio-app/studio-app-ci false
          selftest "$RUNNER_TEMP/Sandbox Studio.app/Contents/MacOS/studio-app" true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: API client types are up to date (make api)
        run: pnpm exec openapi-typescript openapi.json -o "$RUNNER_TEMP/schema.gen.ts" && diff -u src/lib/api/schema.gen.ts "$RUNNER_TEMP/schema.gen.ts"
      - name: OpenCode plugin compatibility
        run: node --test ../internal/harness/opencode-plugin.test.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Chromium for Playwright
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: go vet -tags e2e,nobadger,nomysql,nopgx ./...
      - name: End-to-end suite against the fake runtime
        run: make e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
