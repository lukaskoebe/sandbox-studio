name: nightly

# Real-VM smoke test. The e2e suite runs against the fake runtime on every push (ci.yml);
# this boots the base image in microsandbox, which needs KVM.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Give the runner user access to /dev/kvm
        run: |
          ls -l /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Build Studio and the guest agent
        run: make build
      - name: Install the microsandbox runtime
        # Studio installs msb and libkrunfw into ~/.microsandbox on its first start, as it does
        # for users (README, Requirements). Wait until it listens, then stop it.
        run: |
          ./bin/studio -addr 127.0.0.1:7878 > "$RUNNER_TEMP/studio.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 600); do
            grep -q 'sandbox studio listening' "$RUNNER_TEMP/studio.log" && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -INT "$pid" 2>/dev/null || true
          wait "$pid" || true
          cat "$RUNNER_TEMP/studio.log"
          grep -q 'sandbox studio listening' "$RUNNER_TEMP/studio.log"
          echo "$HOME/.microsandbox/bin" >> "$GITHUB_PATH"
      - name: Base image
        run: make image
      - name: Integration test
        run: go test -tags integration -run TestSandboxLifecycle -v ./internal/sandboxes
