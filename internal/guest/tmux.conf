# Written by studio-agent; put your own settings in ~/.tmux.conf.
# Studio shows terminals as tabs, so tmux keeps out of the way: no status bar, and the
# mouse wheel scrolls tmux history.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g status off
set -g history-limit 50000
set -sg escape-time 10
set -g set-clipboard on
set -g focus-events on
# Scrolling up enters copy mode, where Ctrl-L would do nothing: leave it and clear the screen.
bind -T copy-mode C-l send-keys -X cancel \; send-keys C-l
bind -T copy-mode-vi C-l send-keys -X cancel \; send-keys C-l
# A mouse selection is copied when the button is let go and stays in view, as in a desktop
# terminal, rather than leaving copy mode, which clears it and jumps to the bottom. A click
# clears the selection; at the bottom of the history it leaves copy mode too, as do q and Esc.
# Typing leaves it as well: Studio sends User99 ahead of the keys typed after a click
# (internal/guest/clicks.go), as copy mode would take them.
set -s user-keys[99] "\e[9999~"
bind -n User99 if -F "#{pane_in_mode}" "send-keys -X cancel"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode MouseDown1Pane select-pane \; send-keys -X clear-selection \; if -F "#{==:#{scroll_position},0}" "send-keys -X cancel"
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection \; if -F "#{==:#{scroll_position},0}" "send-keys -X cancel"
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear
bind -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear"
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear"
source-file -q ~/.tmux.conf
