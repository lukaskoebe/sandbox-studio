# An AWS access key. The sandbox gets session credentials made from it, for an hour at a time,
# through credential_process in ~/.aws/config: the AWS CLI and every AWS SDK read it, and
# refresh by themselves. Without a role, they are GetSessionToken's, which can't call IAM;
# with one, they are the role's.
name: aws
title: AWS access key
description: >-
  Sandboxes get session credentials made from the key, for an hour at a time, through a
  profile in ~/.aws/config. The key itself never enters a sandbox.
issuer: aws-sts
fields:
  - name: accessKeyId
    title: Access key ID
    pattern: '^[A-Z0-9]{16,128}$'
  - name: secretAccessKey
    title: Secret access key
    secret: true
  - name: roleArn
    title: Role to assume
    hint: Optional. Sandboxes get the role's credentials instead of the key's own, which can't call IAM.
    optional: true
    pattern: '^arn:aws[a-z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,512}$'
  - name: region
    title: STS region
    hint: Optional. Studio asks STS in this region, such as eu-central-1, instead of the global endpoint.
    optional: true
    pattern: '^[a-z]{2}(-[a-z]+)+-[0-9]$'
hosts: ["*.amazonaws.com"]
lifetime: 1h
env:
  AWS_PROFILE: "{{secret | lower}}"
files:
  - path: .aws/config
    comment: "# "
    content: |
      [profile {{secret | lower}}]
      credential_process = /opt/studio/bin/studio-agent credential {{secret}} process
answers:
  process:
    Version: 1
    AccessKeyId: "{{cred.accessKeyId}}"
    SecretAccessKey: "{{cred.secretAccessKey}}"
    SessionToken: "{{cred.sessionToken}}"
    Expiration: "{{cred.expires}}"
